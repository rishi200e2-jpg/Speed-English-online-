name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          JAVA_MAJOR=$(java -version 2>&1 | head -n 1 | cut -d'"' -f2 | cut -d'.' -f1)
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Active Java major version ($JAVA_MAJOR) is lower than 17."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "Error: ./debug.keystore missing or could not be created."
            exit 1
          fi
          echo "./debug.keystore verified."

      - name: Ensure google-services.json exists
        run: |
          if [ ! -f "app/google-services.json" ]; then
            echo "app/google-services.json is missing, generating fallback google-services.json..."
            mkdir -p app
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "479529719071",
              "project_id": "speed-english-43f15",
              "storage_bucket": "speed-english-43f15.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:479529719071:android:0b59673f8f4e8faa2b0c2a",
                  "android_client_info": {
                    "package_name": "com.apps.speedenglish"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyBjpmbCtd-AItEc5kiTbX4qxHhQalXYH8s"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi
          echo "Verified app/google-services.json exists."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK output
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: Expected APK $APK_PATH was not found."
            echo "Searching in app/build/outputs/apk..."
            find app/build/outputs/apk -name "*.apk" || true
            exit 1
          fi
          echo "Verified APK exists at $APK_PATH."

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
